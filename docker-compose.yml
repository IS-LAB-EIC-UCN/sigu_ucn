services:
  postgres:
    image: postgres:16
    container_name: sigu_ucn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigu_ucn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  migrate:
    image: postgres:16
    depends_on:
      - postgres
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        until pg_isready -h postgres -U postgres -d sigu_ucn; do
          echo "[migrate] Esperando a Postgres..."
          sleep 1
        done
        for f in /migrations/V*.sql; do
          echo "[migrate] Aplicando $$f"
          psql -h postgres -U postgres -d sigu_ucn -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "[migrate] Listo"
    restart: "no"

volumes:
  postgres_data:
