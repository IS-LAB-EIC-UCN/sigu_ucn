services:
  db:
    image: postgres:16
    container_name: sigu_ucn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigu_ucn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: