services:
  postgres:
    image: postgres:16
    container_name: sigu_ucn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigu_ucn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  migrate:
    image: postgres:16
    depends_on:
      - postgres
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        until pg_isready -h postgres -U postgres -d sigu_ucn; do
          echo "[migrate] Esperando a Postgres..."
          sleep 1
        done
        
        # Crear tabla para rastrear migraciones si no existe
        psql -h postgres -U postgres -d sigu_ucn -v ON_ERROR_STOP=1 -c "
        CREATE TABLE IF NOT EXISTS schema_version (
            version VARCHAR(255) PRIMARY KEY,
            applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );"
        
        # Aplicar solo las migraciones que no han sido ejecutadas
        for f in /migrations/V*.sql; do
          filename=$$(basename "$$f")
          already_applied=$$(psql -h postgres -U postgres -d sigu_ucn -tAc "SELECT 1 FROM schema_version WHERE version = '$$filename'")
          
          if [ "$$already_applied" = "1" ]; then
            echo "[migrate] Saltando $$filename (ya aplicada)"
          else
            echo "[migrate] Aplicando $$filename"
            psql -h postgres -U postgres -d sigu_ucn -v ON_ERROR_STOP=1 -f "$$f"
            psql -h postgres -U postgres -d sigu_ucn -v ON_ERROR_STOP=1 -c "INSERT INTO schema_version (version) VALUES ('$$filename')"
          fi
        done
        echo "[migrate] Listo"
    restart: "no"

volumes:
  postgres_data:
